# ============================================================================
#  India Motor - Partner API  (POST /indiamotor/policy)
# ============================================================================
#  Partners send the whole risk in one call. We store it, replay it into
#  WeCore in the order WeCore requires, and hand back the policy number.
#  The figure sent in the request is billed directly.
indiamotor.enabled=true

# The book this business is written into. Product 116 "India Motor" under
# Wenxt Technologies, cloned from Motor (5). Set up by sql/india_motor_setup.sql.
indiamotor.company-id=100046
indiamotor.product-id=116
indiamotor.branch-code=126
indiamotor.agency-code=15840
indiamotor.currency=USD
indiamotor.country-code=IND
indiamotor.mobile-code=91

# B2B: the issuer places the business. There is no consumer here, so no
# portal login is created.
indiamotor.login-id=SathishIMIssuer
indiamotor.password=Admin@09
indiamotor.user-type=Issuer
indiamotor.sub-user-type=both

# PaymentType 1 is what makes insertpaymentdetails mark the payment ACCEPTED
# and generate the policy in the same call.
indiamotor.payment-type=1

# REQUEST bills the figure the partner sent, which is the contract.
indiamotor.premium-source=REQUEST

# Resolve a master description when the partner sends no id for it.
indiamotor.resolve-missing-master-ids=true

# How the business reached the insurer.
indiamotor.source-type-id=3
indiamotor.source-type=Direct
indiamotor.bdm-code=DirectZam

# One key per integrating system (Partner key & legacy key alias)
indiamotor.clients.imk_qa2_insilion_7Kq4XmR2vB9tLzPd.client-id=PARTNER
indiamotor.clients.imk_qa2_insilion_7Kq4XmR2vB9tLzPd.name=India-Motor / B2B Partner
indiamotor.clients.imk_qa2_insilion_7Kq4XmR2vB9tLzPd.enabled=true

indiamotor.clients.imk_qa2_partner_7Kq4XmR2vB9tLzPd.client-id=PARTNER
indiamotor.clients.imk_qa2_partner_7Kq4XmR2vB9tLzPd.name=India-Motor / B2B Partner
