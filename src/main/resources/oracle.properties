##YI_PREM_CAL_PACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O') AND pcd.ms_refno != '' AND em.QUOTE_NO = ? AND pcd.COVER_ID = CASE WHEN pcd.COVERAGE_TYPE = 'T' THEN (SELECT MIN(COVER_ID) FROM policy_cover_data WHERE QUOTE_NO = em.QUOTE_NO AND COVERAGE_TYPE = 'T') ELSE pcd.COVER_ID END GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC;
#YI_POLICY_DETAIL_PACKAGE =SELECT em.CUSTOMER_CODE CUSTOMER_CODE, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, em.EXPIRY_DATE PERIOD_TO, em.INCEPTION_DATE PERIOD_FROM, pi.ID_NUMBER CIVIL_ID, pi.EMAIL_1 CONTACT_EMAIL_ID, pi.CLIENT_NAME CONTACT_PER_NAME, em.CURRENCY PREM_CURR, em.ENTRY_DATE QUOTE_RECEIVED_DT, em.CURRENCY SI_CURR, pi.ADDRESS_1 ADDRESS_LINE1, pi.ADDRESS_2 ADDRESS_LINE2, pi.STATE_NAME STATE, pi.CITY_NAME CITY, pi.CUSTOMER_REFERENCE_NO CUST_REF, em.QUOTE_CREATED_DATE ISSUED_AT, pi.CLIENT_NAME INSURED_FIRSTNAME, pi.MOBILE_NO_1 INSURED_PHONE_NUMBER, pi.EMAIL_1 INSURED_EMAILID, em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pi.CLIENT_NAME INSURED, em.INTEGRATION_STATUS INTEGRATION_STATUS, em.QUOTE_CREATED_DATE QUOTATION_ISSUE_DT, em.APPLICATION_ID UW_ID, em.BRANCH_NAME BRANCH_NAME, em.ENTRY_DATE DATE_OF_COLLECTION, pd.ACCOUNT_NUMBER CREDIT_CARD_NO, pd.PAYMENT_ID TRANSACTION_ID, pd.ENTRY_DATE TRANSACTION_DATE, em.premium_lc  NET_PREMIUM, em.PROMOCODE PROMOCODE, pi.CLIENT_NAME CUSTOMER, pi.MOBILE_NO_1 INSURED_PHONE_NUMBER, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, em.EXCHANGE_RATE EXCHANGE_RATE, pi.ID_NUMBER ID_NUMBER , pi.ID_TYPE_DESC ID_TYPE_DESC, em.ADMIN_LOGIN_ID APPR_UID, em.APPR_CAN_DT APPR_CAN_DT,em.ENDT_COUNT ENDT_COUNT,em.COMMISSION_PERCENTAGE COMMISSION_PERCENTAGE  FROM home_position_master em, personal_info pi, payment_detail pd, policy_cover_data pcd WHERE em.CUSTOMER_ID = pi.CUSTOMER_ID AND em.QUOTE_NO = pd.QUOTE_NO AND pd.PAYMENT_STATUS = 'ACCEPTED' AND pcd.QUOTE_NO = em.QUOTE_NO AND pcd.PRODUCT_ID = em.PRODUCT_ID AND em.QUOTE_NO = ?1 LIMIT 1
#YI_COVER_DETAIL_PACKAGE =SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pcd.RATE RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, pcd.COVER_NAME COVER_DESC, em.POLICY_NO QUOTATION_POLICY_NO, pcd.COVER_ID CVR_ID, em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, pcd.VEHICLE_ID RISK_ID, pcd.SECTION_ID SECTION_ID,pcd.SUM_INSURED SUM_INSURED, pcd.SUM_INSURED_LC SUM_INSURED_LC, pcd.PREMIUM_EXCLUDED_TAX_LC PREMIUM_LC, pcd.PREMIUM_EXCLUDED_TAX_FC PREMIUM_FC, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em, policy_cover_data pcd WHERE pcd.QUOTE_NO = em.QUOTE_NO AND pcd.TAX_ID = '0' AND pcd.Disc_load_Id = '0' AND em.QUOTE_NO =?1
#YI_PREM_CAL_PACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O') AND pcd.ms_refno != '' AND em.QUOTE_NO = ?  AND (pcd.COVERAGE_TYPE <> 'T' OR pcd.COVERAGE_TYPE = 'T') GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC;
##COMMERCIALFIREPACKAGE=SELECT DISTINCT BRD.RISK_ID AS RISK_ID,'NA' AS TIRA_PROD_CODE,'NA' AS CHASSIS_NUMBER,'NA' AS REGISTRATION_NUMBER,HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo  and BRD.section_id=EBD.section_id AND BRD.section_id =:sectionId
##COMMERCIALPACKAGE_FIRESECTIONOLD=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo and BRD.section_id=EBD.section_id AND BRD.section_id =:sectionId
#COMMERCIALPACKAGE_FIRESECTION=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO AND BRD.section_id = :sectionId LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no AND EBD.section_id = BRD.section_id LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND CDD.section_id = :sectionId LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo AND (BRD.section_id = :sectionId OR CDD.section_id = :sectionId)
#ENGINEERINGPACKAGEPLUS=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO  AND BRD.section_id = :sectionId LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no AND EBD.section_id = BRD.section_id LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND CDD.section_id = :sectionId LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) left join  engineering_info ei on ei.quote_no=HPM.quote_no LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data  WHERE disc_load_id = 0 AND coverage_type in( 'B','A','O') GROUP BY quote_no,  section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo AND (BRD.section_id = :sectionId OR CDD.section_id = :sectionId)GROUP BY HPM.INCEPTION_DATE,HPM.EXPIRY_DATE,HPM.POLICY_NO,ei.annual_open,ei.principal_owner,ei.description,ei.start_date,ei.period_of_activity,ei.location_name,ei.construction_type,EBD.LOCATION_NAME,BRD.LOCATION_NAME,CDD.LOCATION_NAME,EBD.ADDRESS,EBD.RISK_ID,BRD.RISK_ID,CDD.RISK_ID,HPM.COMPANY_ID,HPM.PRODUCT_ID,EBD.SECTION_ID,BRD.INDUSTRY_DESC,PCD.regulatory_code,  PCD.regulatory_code,ei.ownership_desc,ei.basic_of_valuation_desc,ei.engine_number,ei.year_of_manufacture,ei.serial_number;


YI_SECTION_DETAIL_PACKAGE =SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.POLICY_NO QUOTATION_POLICY_NO, sdd.risk_id RISK_ID, sdd.section_id SECTION_ID, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em  JOIN policy_cover_data pcd ON em.quote_no = pcd.quote_no LEFT JOIN section_data_details sdd ON sdd.quote_no = em.quote_no AND sdd.section_id = pcd.section_id  WHERE em.QUOTE_NO = ?   group by em.REQUEST_REFERENCE_NO,em.COMPANY_ID,em.PRODUCT_ID,em.SECTION_ID,pcd.SECTION_ID,em.POLICY_NO,em.ENDT_COUNT;
#YI_CHARGE_DETAIL_PACKAGE = SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO,pcd.TAX_ID TAX_ID,  MAX(pcd.RATE) RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, SUM(pcd.PREMIUM_EXCLUDED_TAX_LC) PREMIUM,  em.POLICY_NO QUOTATION_POLICY_NO,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, SUM(pcd.SUM_INSURED) SUM_INSURED,SUM(pcd.SUM_INSURED_LC) SUM_INSURED_LC, em.ENDT_COUNT ENDT_COUNT, pts.CORE_APP_CODE AS Charge_Code, MAX(pcd.TAX_RATE) CHARGE_RATE, SUM(pcd.TAX_AMOUNT) CHARGE_AMOUNT, em.PRODUCT_ID AS PROD_CODE FROM home_position_master em JOIN policy_cover_data pcd ON pcd.QUOTE_NO = em.QUOTE_NO JOIN product_tax_setup pts  ON pcd.TAX_ID = pts.TAX_ID WHERE pcd.QUOTE_NO = em.QUOTE_NO AND pcd.COVERAGE_TYPE = 'T' AND pcd.TAX_ID = pts.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.branch_code = '99999' AND pts.tax_for = 'NB' and pts.tax_id !=41 AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END AND em.QUOTE_NO = ?1 GROUP BY pcd.TAX_ID,   Charge_Code, PROD_CODE, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO,em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT,pcd.TAX_AMOUNT,pts.VALUE;
YI_CHARGE_DETAIL_PACKAGE = SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO,pcd.TAX_ID TAX_ID,  MAX(pcd.RATE) RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, SUM(pcd.PREMIUM_EXCLUDED_TAX_LC) PREMIUM, em.POLICY_NO QUOTATION_POLICY_NO,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, SUM(pcd.SUM_INSURED) SUM_INSURED,SUM(pcd.SUM_INSURED_LC) SUM_INSURED_LC, em.ENDT_COUNT ENDT_COUNT, pts.CORE_APP_CODE AS Charge_Code, MAX(pcd.TAX_RATE) CHARGE_RATE, SUM(pcd.TAX_AMOUNT) CHARGE_AMOUNT, em.PRODUCT_ID AS PROD_CODE FROM home_position_master em JOIN policy_cover_data pcd ON pcd.QUOTE_NO = em.QUOTE_NO  JOIN product_tax_setup pts  ON pcd.TAX_ID = pts.TAX_ID WHERE   pcd.QUOTE_NO = em.QUOTE_NO AND pcd.COVERAGE_TYPE = 'T' AND pcd.TAX_ID = pts.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.branch_code = '99999' AND pts.tax_for = 'NB' and pts.tax_id != 41 AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END AND em.QUOTE_NO = ?1 GROUP BY pcd.TAX_ID, Charge_Code, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, pts.VALUE,em.COMPANY_ID,em.product_id,em.SECTION_ID;
RISK_DETAIL_PACKAGE = SELECT BRD.location_name AS PRAI_REMARKS, BRD.RISK_ID AS RISK_ID, '' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM HOME_POSITION_MASTER HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN SECTION_DATA_DETAILS SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = ? GROUP BY COALESCE(BRD.section_id, CDD.section_id), BRD.location_name, BRD.INDEMITY_PERIOD_DESC, HPM.POLICY_NO, COALESCE(BRD.RISK_ID, CDD.RISK_ID), SDD.STICKER_NUMBER, HPM.REQUEST_REFERENCE_NO, HPM.INCEPTION_DATE, HPM.EXPIRY_DATE, HPM.ENDT_COUNT, HPM.COMPANY_ID, HPM.PRODUCT_ID, PCD.total_cover, PCD.regulatory_code, BRD.INDUSTRY_DESC, BRD.CATEGORY_DESC, BRD.BUILDING_USAGE_DESC, BRD.DESCRIPTION_OF_RISK, BRD.WALL_TYPE_DESC, BRD.ROOF_TYPE_DESC, BRD.FIRST_LOSS_PERCENT, BRD.CONTENT_DESC, BRD.OCCUPATION_TYPE_DESC, PRAI_SEC_CODE, CDD.SECTION_ID, CDD.NATURE_OF_BUSINESS_DESC, CDD.LOCATION_NAME, CDD.CATEGORY_DESC, BRD.RISK_ID, CDD.COUNT, BRD.SECTION_ID;
YI_POLICY_APPROVAL_PACKAGE =SELECT  em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, em.POLICY_NO QUOTATION_POLICY_NO,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO,em.REQUEST_REFERENCE_NO REQUESTREFERENCENO,em.ENDT_COUNT ENDT_COUNT  FROM home_position_master em WHERE em.QUOTE_NO=?1
CREDIT_LIMIT_DETAIL_PACKAGE =SELECT em.CUSTOMER_ID CUSTOMER_CODE, em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.ENDT_COUNT ENDT_COUNT  FROM home_position_master em, personal_info PI WHERE  em.CUSTOMER_ID = pi.CUSTOMER_ID  AND em.QUOTE_NO =?1 LIMIT 1  
#YI_PREM_CAL_PACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O') AND pcd.ms_refno != '' AND em.QUOTE_NO = ? AND pcd.COVER_ID = CASE WHEN pcd.COVERAGE_TYPE = 'T' THEN (SELECT MIN(COVER_ID) FROM policy_cover_data WHERE QUOTE_NO = em.QUOTE_NO AND COVERAGE_TYPE = 'T') ELSE pcd.COVER_ID END GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC;
YI_POLICY_DETAIL_PACKAGE =SELECT em.CUSTOMER_CODE CUSTOMER_CODE, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, em.EXPIRY_DATE PERIOD_TO, em.INCEPTION_DATE PERIOD_FROM, pi.ID_NUMBER CIVIL_ID, pi.EMAIL_1 CONTACT_EMAIL_ID, pi.CLIENT_NAME CONTACT_PER_NAME, em.CURRENCY PREM_CURR, em.ENTRY_DATE QUOTE_RECEIVED_DT, em.CURRENCY SI_CURR, pi.ADDRESS_1 ADDRESS_LINE1, pi.ADDRESS_2 ADDRESS_LINE2, pi.STATE_NAME STATE, pi.CITY_NAME CITY, pi.CUSTOMER_REFERENCE_NO CUST_REF, em.QUOTE_CREATED_DATE ISSUED_AT, pi.CLIENT_NAME INSURED_FIRSTNAME, pi.MOBILE_NO_1 INSURED_PHONE_NUMBER, pi.EMAIL_1 INSURED_EMAILID, em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pi.CLIENT_NAME INSURED, em.INTEGRATION_STATUS INTEGRATION_STATUS, em.QUOTE_CREATED_DATE QUOTATION_ISSUE_DT, em.APPLICATION_ID UW_ID, em.BRANCH_NAME BRANCH_NAME, em.ENTRY_DATE DATE_OF_COLLECTION, pd.ACCOUNT_NUMBER CREDIT_CARD_NO, pd.PAYMENT_ID TRANSACTION_ID, pd.ENTRY_DATE TRANSACTION_DATE, em.premium_lc  NET_PREMIUM, em.PROMOCODE PROMOCODE, pi.CLIENT_NAME CUSTOMER, pi.MOBILE_NO_1 INSURED_PHONE_NUMBER, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, em.EXCHANGE_RATE EXCHANGE_RATE, pi.ID_NUMBER ID_NUMBER , pi.ID_TYPE_DESC ID_TYPE_DESC, em.ADMIN_LOGIN_ID APPR_UID, em.APPR_CAN_DT APPR_CAN_DT,em.ENDT_COUNT ENDT_COUNT,em.COMMISSION_PERCENTAGE COMMISSION_PERCENTAGE  FROM home_position_master em, personal_info pi, payment_detail pd, policy_cover_data pcd WHERE em.CUSTOMER_ID = pi.CUSTOMER_ID AND em.QUOTE_NO = pd.QUOTE_NO AND pd.PAYMENT_STATUS = 'ACCEPTED' AND pcd.QUOTE_NO = em.QUOTE_NO AND pcd.PRODUCT_ID = em.PRODUCT_ID AND em.QUOTE_NO = ?1 LIMIT 1
YI_COVER_DETAIL_PACKAGE =SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pcd.RATE RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, pcd.COVER_NAME COVER_DESC, em.POLICY_NO QUOTATION_POLICY_NO, pcd.COVER_ID CVR_ID, em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, pcd.VEHICLE_ID RISK_ID, pcd.SECTION_ID SECTION_ID,pcd.SUM_INSURED SUM_INSURED, pcd.SUM_INSURED_LC SUM_INSURED_LC, pcd.PREMIUM_EXCLUDED_TAX_LC PREMIUM_LC, pcd.PREMIUM_EXCLUDED_TAX_FC PREMIUM_FC, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em, policy_cover_data pcd WHERE pcd.QUOTE_NO = em.QUOTE_NO AND pcd.TAX_ID = '0' AND pcd.Disc_load_Id = '0' AND em.QUOTE_NO =?1
#YI_PREM_CAL_PACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O') AND pcd.ms_refno != '' AND em.QUOTE_NO = ?  AND (pcd.COVERAGE_TYPE <> 'T' OR pcd.COVERAGE_TYPE = 'T') GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC , pcd.PREMIUM_EXCLUDED_TAX_FC,em.VAT_PREMIUM_LC;

YI_PREM_CAL_PACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O','E') AND pcd.ms_refno != '' AND em.QUOTE_NO = ?  AND ((IFNULL(em.endt_count, 0) = 0 AND pcd.disc_load_id = '0' AND pcd.coverage_type <> 'E' )OR (pcd.disc_load_id = em.ENDT_TYPE_ID)) GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC , pcd.PREMIUM_EXCLUDED_TAX_FC,em.VAT_PREMIUM_LC;
#COMMERCIALFIREPACKAGE=SELECT DISTINCT BRD.RISK_ID AS RISK_ID,'NA' AS TIRA_PROD_CODE,'NA' AS CHASSIS_NUMBER,'NA' AS REGISTRATION_NUMBER,HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo  and BRD.section_id=EBD.section_id AND BRD.section_id =:sectionId
#COMMERCIALPACKAGE_FIRESECTIONOLD=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo and BRD.section_id=EBD.section_id AND BRD.section_id =:sectionId
COMMERCIALPACKAGE_FIRESECTION=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO AND BRD.section_id = :sectionId LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no AND EBD.section_id = BRD.section_id LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND CDD.section_id = :sectionId LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo AND (BRD.section_id = :sectionId OR CDD.section_id = :sectionId)
ENGINEERINGPACKAGEPLUS=SELECT HPM.INCEPTION_DATE AS PRAI_EFF_FM_DT, HPM.EXPIRY_DATE AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS QUOTATION_POLICY_NO FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO  AND BRD.section_id = :sectionId LEFT JOIN eservice_building_details EBD ON EBD.request_reference_no = BRD.request_reference_no AND EBD.section_id = BRD.section_id LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND CDD.section_id = :sectionId LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) left join  engineering_info ei on ei.quote_no=HPM.quote_no and  ei.section_id = :sectionId LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data  WHERE disc_load_id = 0 AND coverage_type in( 'B','A','O') GROUP BY quote_no,  section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo AND (BRD.section_id = :sectionId OR CDD.section_id = :sectionId)GROUP BY HPM.INCEPTION_DATE,HPM.EXPIRY_DATE,HPM.POLICY_NO,ei.annual_open,ei.principal_owner,ei.description,ei.start_date,ei.period_of_activity,ei.location_name,ei.construction_type,EBD.LOCATION_NAME,BRD.LOCATION_NAME,CDD.LOCATION_NAME,EBD.ADDRESS,EBD.RISK_ID,BRD.RISK_ID,CDD.RISK_ID,HPM.COMPANY_ID,HPM.PRODUCT_ID,EBD.SECTION_ID,BRD.INDUSTRY_DESC,PCD.regulatory_code,PCD.regulatory_code,ei.ownership_desc,ei.basic_of_valuation_desc,ei.engine_number,ei.year_of_manufacture,ei.serial_number,ei.SECTION_ID,ei.period_type;
YI_PREM_CAL_ENGINEERINGPACKAGE= SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B','O') AND pcd.ms_refno != '' AND em.QUOTE_NO = ?  AND (pcd.COVERAGE_TYPE <> 'T' OR pcd.COVERAGE_TYPE = 'T')  AND ((pcd.COVERAGE_TYPE = 'T' AND pcd.COVER_ID = (SELECT MIN(COVER_ID) FROM policy_cover_data WHERE QUOTE_NO = em.QUOTE_NO AND COVERAGE_TYPE = 'T')) OR  pcd.COVERAGE_TYPE IN ('B', 'O','A')) GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC , pcd.PREMIUM_EXCLUDED_TAX_FC,em.VAT_PREMIUM_LC;
CROP_RISK_DETAIL_PACKAGE = SELECT BRD.RISK_ID AS RISK_ID, '' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = ? GROUP BY COALESCE(BRD.section_id, CDD.section_id), BRD.location_name, BRD.INDEMITY_PERIOD_DESC, HPM.POLICY_NO, COALESCE(BRD.RISK_ID, CDD.RISK_ID), SDD.STICKER_NUMBER, HPM.REQUEST_REFERENCE_NO, HPM.INCEPTION_DATE, HPM.EXPIRY_DATE, HPM.ENDT_COUNT, HPM.COMPANY_ID, HPM.PRODUCT_ID, PCD.total_cover, PCD.regulatory_code, BRD.INDUSTRY_DESC, BRD.CATEGORY_DESC, BRD.BUILDING_USAGE_DESC, BRD.DESCRIPTION_OF_RISK, BRD.WALL_TYPE_DESC, BRD.ROOF_TYPE_DESC, BRD.FIRST_LOSS_PERCENT, BRD.CONTENT_DESC, BRD.OCCUPATION_TYPE_DESC, PRAI_SEC_CODE, CDD.SECTION_ID, CDD.NATURE_OF_BUSINESS_DESC, CDD.LOCATION_NAME, CDD.CATEGORY_DESC, BRD.RISK_ID, CDD.COUNT, BRD.SECTION_ID,BRD.wall_type,BRD.roof_type,BRD.building_floors,BRD.description_of_risk,BRD.region_desc,BRD.BUILDING_USAGE_ID,BRD.ADDRESS,BRD.DISTRICT_CODE,CDD.indemnity_Type,CDD.count,BRD.DISTRICT_CODE;
#Health_RISK_DETAIL_PACKAGE= SELECT BRD.RISK_ID AS RISK_ID, '' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN eservice_common_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO  LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID)     AND SDD.section_id = CDD.section_id  LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = ? GROUP BY COALESCE(BRD.section_id, CDD.section_id), BRD.location_name, BRD.INDEMITY_PERIOD_DESC, HPM.POLICY_NO, COALESCE(BRD.RISK_ID, CDD.RISK_ID), SDD.STICKER_NUMBER, HPM.REQUEST_REFERENCE_NO, HPM.INCEPTION_DATE, HPM.EXPIRY_DATE, HPM.ENDT_COUNT, HPM.COMPANY_ID, HPM.PRODUCT_ID, PCD.total_cover, PCD.regulatory_code, BRD.INDUSTRY_DESC, BRD.CATEGORY_DESC, BRD.BUILDING_USAGE_DESC, BRD.DESCRIPTION_OF_RISK, BRD.WALL_TYPE_DESC, BRD.ROOF_TYPE_DESC, BRD.FIRST_LOSS_PERCENT, BRD.CONTENT_DESC, BRD.OCCUPATION_TYPE_DESC, PRAI_SEC_CODE, CDD.SECTION_ID, CDD.NATURE_OF_BUSINESS_DESC, CDD.LOCATION_NAME, CDD.CATEGORY_DESC, BRD.RISK_ID, CDD.COUNT, BRD.SECTION_ID,BRD.wall_type,BRD.roof_type,BRD.building_floors,BRD.description_of_risk,BRD.region_desc,BRD.BUILDING_USAGE_ID,BRD.ADDRESS,CDD.indemnity_Type,CDD.count,BRD.DISTRICT_CODE;
Health_RISK_DETAIL_PACKAGE= SELECT BRD.RISK_ID AS RISK_ID, '' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN eservice_common_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO  LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID)     AND SDD.section_id = CDD.section_id  LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = ? GROUP BY  BRD.location_name,HPM.POLICY_NO,BRD.RISK_ID,BRD.section_id,BRD.building_floors,  BRD.roof_type,HPM.inception_date,HPM.ENDT_COUNT,BRD.Address,CDD.indemnity_Type,BRD.Building_Usage_Id,BRD.region_desc,BRD.description_of_risk,BRD.wall_type,SDD.STICKER_NUMBER,HPM.request_reference_no,HPM.expiry_date,HPM.policy_no,HPM.COMPANY_ID, HPM.PRODUCT_ID,CDD.LOCATION_NAME,CDD.RISK_ID,CDD.SECTION_ID;
NICHE_PACKAGE=SELECT CDD.RISK_ID AS RISK_ID,'' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM home_position_master HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN eservice_common_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO  LEFT JOIN section_data_details SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID)     AND SDD.section_id = CDD.section_id  LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = :quoteNo  and CDD.section_id = :sectionId GROUP BY  BRD.location_name,HPM.POLICY_NO,BRD.RISK_ID,BRD.section_id,BRD.building_floors,BRD.roof_type,HPM.inception_date,HPM.ENDT_COUNT,BRD.Address,CDD.indemnity_Type,BRD.Building_Usage_Id,BRD.region_desc,BRD.description_of_risk,BRD.wall_type,SDD.STICKER_NUMBER,HPM.request_reference_no,HPM.expiry_date,HPM.policy_no,HPM.COMPANY_ID, HPM.PRODUCT_ID,CDD.LOCATION_NAME,CDD.RISK_ID,CDD.SECTION_ID , CDD.ADDRESS;
YI_COVER_DETAIL_PACKAGE_ENDOSEMENT=SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pcd.RATE RATE,em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS,pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, pcd.COVER_NAME COVER_DESC, em.POLICY_NO QUOTATION_POLICY_NO, pcd.COVER_ID CVR_ID,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, pcd.VEHICLE_ID RISK_ID, pcd.SECTION_ID SECTION_ID,pcd.SUM_INSURED SUM_INSURED, pcd.SUM_INSURED_LC SUM_INSURED_LC, pcd.PREMIUM_EXCLUDED_TAX_LC PREMIUM_LC, pcd.PREMIUM_EXCLUDED_TAX_FC PREMIUM_FC, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em, policy_cover_data pcd WHERE pcd.quote_no = em.quote_no AND em.quote_no = ? AND pcd.tax_id = '0'AND ((IFNULL(em.endt_count, 0) = 0 AND pcd.disc_load_id = '0' AND pcd.coverage_type <> 'E') OR (pcd.disc_load_id =em.ENDT_TYPE_ID) );