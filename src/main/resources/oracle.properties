TRAVEL_RISK_DETAIL = SELECT TPD.request_reference_no REQUESTREFERENCENO, TPD.passenger_name AS PRAI_DATA_01,TPD.passenger_id AS PRAI_RISK_ID,TPD.travel_cover_duration AS PRAI_NUM_06,TPD.plan_type_desc AS PRAI_CODE_01,TPD.passport_no  AS PRAI_DATA_08,TPD.gender_desc AS PRAI_DATA_05, TPD.DOB AS PRAI_DATE_01,TPD.age AS PRAI_NUM_19,TPD.nationality AS PRAI_DATA_09, TPD.source_country_desc AS PRAI_REMARKS_01, TPD.destination_country_desc  AS PRAI_DATA_06, em.original_policy_no  AS PRAI_DATA_11,'NA' as PRAI_DATA_03,TPD.passenger_name AS RISK_ID FROM home_position_master em ,  travel_passenger_details  TPD WHERE em.QUOTE_NO = TPD.QUOTE_NO AND TPD.relation_desc = 'Self' AND TPD.status = 'P' AND em.quote_no = ?1
YI_CHARGE_DETAIL_TRAVEL = SELECT MAX(em.REQUEST_REFERENCE_NO) REQUESTREFERENCENO, MAX(pcd.RATE) RATE, MAX(em.RENEWAL_STATUS) RENEWAL_CURRENT_STATUS, MAX(pcd.PREMIUM_EXCLUDED_TAX_LC) PREMIUM, MAX(pcd.COVER_NAME) COVER_DESC, MAX(em.POLICY_NO) QUOTATION_POLICY_NO, MAX(pcd.COVER_ID) CVR_ID, MAX(em.RENEWAL_OLD_POLICY) RENEWAL_POLICY_NO, MAX(pcd.VEHICLE_ID) RISK_ID, MAX(pcd.SECTION_ID) SECTION_ID, MAX(pcd.SUM_INSURED) SUM_INSURED, MAX(pcd.SUM_INSURED_LC) SUM_INSURED_LC, MAX(pcd.PREMIUM_EXCLUDED_TAX_FC) PREMIUM_FC, MAX(em.ENDT_COUNT) ENDT_COUNT, pts.CORE_APP_CODE AS Charge_Code, MAX(pcd.TAX_RATE) CHARGE_RATE, SUM(pcd.TAX_AMOUNT) CHARGE_AMOUNT, SUM(pcd.TAX_AMOUNT) VAT_AMOUNT FROM home_position_master em JOIN policy_cover_data pcd ON pcd.QUOTE_NO = em.QUOTE_NO LEFT JOIN product_tax_setup pts ON pcd.TAX_ID = pts.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.branch_code = '99999' AND pts.tax_for = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN('T','L') AND ((pts.TAX_ID IS NOT NULL AND pcd.ms_refno != '') OR (pcd.vehicle_id = 99999 AND pcd.disc_load_id = 0 AND pcd.ms_refno = '' AND pts.TAX_ID=42)) AND em.QUOTE_NO = ?1 GROUP BY em.COMPANY_ID, em.PRODUCT_ID, pcd.TAX_RATE, pcd.COVER_NAME, em.REQUEST_REFERENCE_NO, pcd.VEHICLE_ID, pcd.DISC_LOAD_ID, pts.CORE_APP_CODE;
YI_POLICY_DETAIL_TRAVEL=SELECT em.CUSTOMER_CODE CUSTOMER_CODE, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, em.EXPIRY_DATE PERIOD_TO, em.INCEPTION_DATE PERIOD_FROM, pi.KRA_PIN CIVIL_ID, pi.EMAIL_1 CONTACT_EMAIL_ID, pi.CLIENT_NAME CONTACT_PER_NAME, em.CURRENCY PREM_CURR, em.ENTRY_DATE QUOTE_RECEIVED_DT, em.CURRENCY SI_CURR, pi.ADDRESS_1 ADDRESS_LINE1, pi.ADDRESS_2 ADDRESS_LINE2, pi.STATE_NAME STATE, pi.CITY_NAME CITY, pi.CUSTOMER_REFERENCE_NO CUST_REF, em.QUOTE_CREATED_DATE ISSUED_AT, pi.CLIENT_NAME INSURED_FIRSTNAME, pi.LAST_NAME INSURED_LASTNAME, PI.MOBILE_NO_1 INSURED_PHONE_NUMBER, pi.EMAIL_1 INSURED_EMAILID, em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pi.CLIENT_NAME INSURED, em.INTEGRATION_STATUS INTEGRATION_STATUS, em.QUOTE_CREATED_DATE QUOTATION_ISSUE_DT, em.APPLICATION_ID UW_ID, em.BRANCH_NAME BRANCH_NAME, em.ENTRY_DATE DATE_OF_COLLECTION, pd.ACCOUNT_NUMBER CREDIT_CARD_NO, pd.PAYMENT_ID TRANSACTION_ID, pd.ENTRY_DATE TRANSACTION_DATE, em.OVERALL_PREMIUM_LC NET_PREMIUM, em.PROMOCODE PROMOCODE, pi.CLIENT_NAME CUSTOMER, PI.MOBILE_NO_1 INSURED_PHONE_NUMBER, em.QUOTE_CREATED_DATE POLICY_ISSUE_DT, pcd.PREMIUM_INCLUDED_TAX_LC PREMIUM, em.EXCHANGE_RATE EXCHANGE_RATE, PI.ID_NUMBER ID_NUMBER, PI.ID_TYPE_DESC ID_TYPE_DESC, em.ADMIN_LOGIN_ID APPR_UID, em.APPR_CAN_DT APPR_CAN_DT, em.ENDT_COUNT ENDT_COUNT, em.COMMISSION_PERCENTAGE COMMISSION_PERCENTAGE, em.COMPANY_ID VAL_COMPANY_ID, em.NO_OF_INSTALLMENT NO_OF_INSTALLMENT FROM home_position_master em, personal_info PI, payment_detail pd, policy_cover_data pcd WHERE em.CUSTOMER_ID = pi.CUSTOMER_ID AND em.QUOTE_NO = pd.QUOTE_NO AND pd.PAYMENT_STATUS = 'ACCEPTED' AND pcd.QUOTE_NO = em.QUOTE_NO AND PCD.PRODUCT_ID = em.PRODUCT_ID AND em.QUOTE_NO = ?1 LIMIT 1
YI_COVER_DETAIL_TRAVEL = SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pcd.RATE RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, pcd.rate PREMIUM, pcd.COVER_NAME COVER_DESC, em.POLICY_NO QUOTATION_POLICY_NO, pcd.COVER_ID CVR_ID, em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, TPD.passenger_id RISK_ID, pcd.SECTION_ID SECTION_ID, pcd.SUM_INSURED SUM_INSURED, pcd.SUM_INSURED_LC SUM_INSURED_LC, pcd.rate PREMIUM_LC, pcd.PREMIUM_EXCLUDED_TAX_FC PREMIUM_FC, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON pcd.QUOTE_NO = em.QUOTE_NO JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID JOIN travel_passenger_details TPD on TPD.QUOTE_NO = em.QUOTE_NO WHERE pcd.QUOTE_NO = em.QUOTE_NO  AND pcd.TAX_ID = '0' AND pcd.Disc_load_Id = '0' AND pcd.ms_refno != ''  AND pcd.cover_id !=126 AND em.QUOTE_NO = ?1 GROUP BY pcd.cover_name, pcd.cover_desc, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COMPANY_ID, em.company_id, em.PRODUCT_ID, em.SECTION_ID, pcd.rate, pcd.PREMIUM_EXCLUDED_TAX_FC, em.POLICY_NO, em.ENDT_COUNT, pcd.COVERAGE_TYPE, pcd.rate, pcd.SUM_INSURED, em.RENEWAL_STATUS, pcd.CALC_TYPE, pcd.VEHICLE_ID, pcd.SUM_INSURED_LC, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, pcd.COVER_ID,  TPD.PASSENGER_ID, pcd.TAX_RATE;
YI_PREM_CAL = SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, pcd.TAX_AMOUNT SUM_INSURED, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, pcd.COVER_NAME COVER_DESCRIPTION, pcd.PREMIUM_INCLUDED_TAX_FC COVER_PREMIUM, em.POLICY_NO QUOTATION_POLICY_NO, em.PRODUCT_ID PRODUCT_CODE,pcd.VEHICLE_ID RISK_ID, pcd.SECTION_ID SECTION_ID, em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID= em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master  exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID  WHERE (pcd.COVERAGE_TYPE IN ('T','B')  AND pcd.ms_refno != '' AND em.QUOTE_NO = ?1)OR (pcd.vehicle_id = 99999 AND pcd.disc_load_id = 0  AND pcd.tax_id=42) AND em.QUOTE_NO = ?1 GROUP BY em.COMPANY_ID,em.PRODUCT_ID,em.QUOTE_NO,em.RENEWAL_OLD_POLICY,em.REQUEST_REFERENCE_NO,em.RENEWAL_STATUS,em.POLICY_NO,em.ENDT_COUNT,em.SECTION_ID,pcd.VEHICLE_ID,pcd.TAX_AMOUNT,pcd.COVER_NAME,pcd.COVERAGE_TYPE,pts.TAX_ID,pcd.MS_REFNO,pcd.DISC_LOAD_ID,pcd.SECTION_ID,pcd.PRODUCT_ID,pcd.COVER_ID,pcd.COMPANY_ID,pcd.RATE,exm.EXCHANGE_RATe,pcd.TAX_RATE,pts.CORE_APP_CODE,em.OVERALL_PREMIUM_FC
#coporate Plus

#/****Corporate plus****/
YI_SECTION_DETAIL_COPORATEPLUS =SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.POLICY_NO QUOTATION_POLICY_NO, sdd.risk_id RISK_ID, sdd.section_id SECTION_ID, em.ENDT_COUNT ENDT_COUNT FROM home_position_master em  JOIN policy_cover_data pcd ON em.quote_no = pcd.quote_no JOIN section_data_details sdd ON sdd.quote_no = em.quote_no AND sdd.section_id = pcd.section_id  WHERE em.QUOTE_NO = ?   group by em.REQUEST_REFERENCE_NO,em.COMPANY_ID,em.PRODUCT_ID,em.SECTION_ID,pcd.SECTION_ID,em.POLICY_NO,em.ENDT_COUNT;
YI_CHARGE_DETAIL_COPORATEPLUS = SELECT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, MAX(pcd.RATE) RATE, em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, SUM(pcd.PREMIUM_EXCLUDED_TAX_LC) PREMIUM,  em.POLICY_NO QUOTATION_POLICY_NO,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO, SUM(pcd.SUM_INSURED) SUM_INSURED,SUM(pcd.SUM_INSURED_LC) SUM_INSURED_LC, em.ENDT_COUNT ENDT_COUNT, pts.CORE_APP_CODE AS Charge_Code, MAX(pcd.TAX_RATE) CHARGE_RATE, SUM(pcd.TAX_AMOUNT) CHARGE_AMOUNT, em.PRODUCT_ID AS PROD_CODE FROM home_position_master em JOIN policy_cover_data pcd ON pcd.QUOTE_NO = em.QUOTE_NO JOIN product_tax_setup pts  ON pcd.TAX_ID = pts.TAX_ID WHERE pcd.QUOTE_NO = em.QUOTE_NO AND pcd.COVERAGE_TYPE = 'T' AND pcd.TAX_ID = pts.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.branch_code = '99999' AND pts.tax_for = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END AND em.QUOTE_NO = ?1 GROUP BY  Charge_Code, PROD_CODE, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO,em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT;
RISK_DETAIL_COPORATEPLUS = SELECT BRD.location_name AS PRAI_REMARKS, BRD.RISK_ID AS RISK_ID, '' AS PRAI_EFF_FM_DT, '' AS PRAI_EFF_TO_DT, HPM.POLICY_NO AS POLICY_NO, HPM.ENDT_COUNT ENDT_COUNT, SDD.STICKER_NUMBER STICKER_NUMBER, HPM.INCEPTION_DATE PRAI_EFF_TO_DT, HPM.EXPIRY_DATE PRAI_EFF_TO_DT, '' AS PRAI_SEC_CODE FROM HOME_POSITION_MASTER HPM LEFT JOIN building_risk_details BRD ON BRD.QUOTE_NO = HPM.QUOTE_NO LEFT JOIN common_data_details CDD ON HPM.QUOTE_NO = CDD.QUOTE_NO AND BRD.section_id = CDD.section_id LEFT JOIN SECTION_DATA_DETAILS SDD ON SDD.QUOTE_NO = HPM.QUOTE_NO AND SDD.RISK_ID = COALESCE(BRD.RISK_ID, CDD.RISK_ID) LEFT JOIN (SELECT quote_no, section_id, SUM(SUM_INSURED) AS total_cover, MAX(regulatory_code) AS regulatory_code FROM policy_cover_data WHERE disc_load_id = 0 AND coverage_type = 'B' GROUP BY quote_no, section_id) PCD ON PCD.quote_no = HPM.quote_no AND PCD.section_id = COALESCE(BRD.section_id, CDD.section_id) WHERE HPM.QUOTE_NO = ? AND  BRD.section_id NOT IN(217,218) GROUP BY COALESCE(BRD.section_id, CDD.section_id), BRD.location_name, BRD.INDEMITY_PERIOD_DESC, HPM.POLICY_NO, COALESCE(BRD.RISK_ID, CDD.RISK_ID), SDD.STICKER_NUMBER, HPM.REQUEST_REFERENCE_NO, HPM.INCEPTION_DATE, HPM.EXPIRY_DATE, HPM.ENDT_COUNT, HPM.COMPANY_ID, HPM.PRODUCT_ID, PCD.total_cover, PCD.regulatory_code, BRD.INDUSTRY_DESC, BRD.CATEGORY_DESC, BRD.BUILDING_USAGE_DESC, BRD.DESCRIPTION_OF_RISK, BRD.WALL_TYPE_DESC, BRD.ROOF_TYPE_DESC, BRD.FIRST_LOSS_PERCENT, BRD.CONTENT_DESC, BRD.OCCUPATION_TYPE_DESC, PRAI_SEC_CODE, CDD.SECTION_ID, CDD.NATURE_OF_BUSINESS_DESC, CDD.LOCATION_NAME, CDD.CATEGORY_DESC, BRD.RISK_ID, CDD.COUNT, BRD.SECTION_ID;
YI_POLICY_APPROVAL_COPORATEPLUS =SELECT  em.RENEWAL_STATUS RENEWAL_CURRENT_STATUS, em.POLICY_NO QUOTATION_POLICY_NO,em.RENEWAL_OLD_POLICY RENEWAL_POLICY_NO,em.REQUEST_REFERENCE_NO REQUESTREFERENCENO,em.ENDT_COUNT ENDT_COUNT  FROM home_position_master em WHERE em.QUOTE_NO=?1
CREDIT_LIMIT_DETAIL_COPORATEPLUS =SELECT em.CUSTOMER_ID CUSTOMER_CODE, em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.ENDT_COUNT ENDT_COUNT  FROM home_position_master em, personal_info pi WHERE  em.CUSTOMER_ID = pi.CUSTOMER_ID  AND em.QUOTE_NO =?1 LIMIT 1  
YI_PREM_CAL_CORPORATEPLUS = SELECT DISTINCT em.REQUEST_REFERENCE_NO REQUESTREFERENCENO, em.RENEWAL_STATUS AS RENEWAL_CURRENT_STATUS, em.POLICY_NO AS QUOTATION_POLICY_NO, pcd.VEHICLE_ID AS RISK_ID, em.RENEWAL_OLD_POLICY AS RENEWAL_POLICY_NO, em.ENDT_COUNT AS ENDT_COUNT FROM home_position_master em JOIN policy_cover_data pcd ON em.QUOTE_NO = pcd.QUOTE_NO LEFT JOIN product_tax_setup pts ON pts.TAX_ID = pcd.TAX_ID AND pts.COMPANY_ID = em.COMPANY_ID AND pts.PRODUCT_ID = em.PRODUCT_ID AND pts.STATUS = 'Y' AND pts.BRANCH_CODE = '99999' AND pts.TAX_FOR = 'NB' AND SYSDATE() BETWEEN pts.EFFECTIVE_DATE_START AND pts.EFFECTIVE_DATE_END JOIN eway_currency_master ec ON ec.SHORT_NAME = em.CURRENCY AND ec.COMPANY_ID = em.COMPANY_ID JOIN eway_exchange_master exm ON exm.CURRENCY_ID = ec.CURRENCY_ID AND exm.COMPANY_ID = ec.COMPANY_ID WHERE pcd.COVERAGE_TYPE IN ('T', 'B') AND pcd.ms_refno != '' AND em.QUOTE_NO = ? AND pcd.COVER_ID = CASE WHEN pcd.COVERAGE_TYPE = 'T' THEN (SELECT MIN(COVER_ID) FROM policy_cover_data WHERE QUOTE_NO = em.QUOTE_NO AND COVERAGE_TYPE = 'T') ELSE pcd.COVER_ID END GROUP BY em.COMPANY_ID, em.PRODUCT_ID, em.QUOTE_NO, em.RENEWAL_OLD_POLICY, em.REQUEST_REFERENCE_NO, em.RENEWAL_STATUS, em.POLICY_NO, em.ENDT_COUNT, em.SECTION_ID, pcd.VEHICLE_ID, pcd.TAX_AMOUNT, pcd.COVER_NAME, pcd.COVERAGE_TYPE, pts.TAX_ID, pcd.MS_REFNO, pcd.DISC_LOAD_ID, pcd.SECTION_ID, pcd.PRODUCT_ID, pcd.COVER_ID, pcd.COMPANY_ID, pcd.RATE, exm.EXCHANGE_RATE, pcd.TAX_RATE, pts.CORE_APP_CODE, em.OVERALL_PREMIUM_FC, pcd.sum_insured, pcd.PREMIUM_INCLUDED_TAX_FC,pcd.PREMIUM_EXCLUDED_TAX_LC;
